<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress Hub • Power Up Challenge</title>
  <meta name="description" content="Manage your progress posts, view the live countdown, and see weekly rewards status.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles/main.css">
  <style type="text/tailwindcss" data-teda="tailwind-apply">
    @layer components {
      .btn-primary { @apply inline-flex items-center justify-center whitespace-nowrap bg-[#ff5a54] text-white px-5 py-3 rounded-full text-sm md:text-base font-semibold shadow-[0_10px_25px_rgba(255,90,84,0.35)] hover:bg-[#e84a45] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#ffb3af] transition; }
      .btn-ghost { @apply inline-flex items-center justify-center whitespace-nowrap border border-slate-300/60 bg-white text-slate-800 px-4 py-2.5 rounded-full text-sm font-medium hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-200 transition; }
      .card { @apply bg-white rounded-2xl shadow-[0_10px_30px_rgba(2,6,23,0.08)] ring-1 ring-slate-900/5; }
      .input { @apply w-full border border-slate-300/70 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#ffb3af] focus:border-[#ff5a54] transition bg-white; }
      .label { @apply text-xs font-semibold text-slate-600 mb-1; }
      .reel-card { @apply bg-white rounded-xl overflow-hidden border border-slate-200/70 shadow-sm; }
    }
  </style>
</head>
<body class="bg-[#f7f8fb] text-slate-800 antialiased selection:bg-[#ffedea] selection:text-slate-900">
  <header class="sticky top-0 z-30 backdrop-blur supports-backdrop-blur:bg-white/80 bg-white/70 border-b border-slate-200/60">
    <nav class="max-w-6xl mx-auto px-4 md:px-6 flex items-center justify-between h-14">
      <a href="index.html" class="btn-ghost" aria-label="Back to landing">← Back</a>
      <div class="text-sm text-slate-600">Live Countdown: <span id="hub-count" class="font-bold text-slate-900">--:--:--</span></div>
      <span class="hidden md:inline text-xs text-slate-500">Progress Hub</span>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 md:px-6 py-8 md:py-12">
    <section class="grid md:grid-cols-12 gap-6">
      <div class="md:col-span-7 card p-5 md:p-6">
        <div class="flex items-center justify-between">
          <h1 class="text-xl md:text-2xl font-extrabold text-slate-900">Your Reel Posts</h1>
          <button id="clear-my-posts" class="btn-ghost text-xs">Clear my posts</button>
        </div>
        <div id="hub-reel" class="mt-4 grid sm:grid-cols-2 gap-4"></div>
        <p class="text-xs text-slate-500 mt-3">Tip: You can remove your posts by clicking the options menu on a card.</p>
      </div>
      <div class="md:col-span-5 card p-5 md:p-6">
        <h2 class="text-lg font-bold text-slate-900">Add a new post</h2>
        <form id="hub-form" class="mt-4 grid gap-4" novalidate>
          <div>
            <label class="label" for="h-name">Your name</label>
            <input id="h-name" name="name" class="input" type="text" placeholder="Avery" maxlength="40" required>
          </div>
          <div>
            <label class="label" for="h-note">Progress note</label>
            <input id="h-note" name="note" class="input" type="text" placeholder="Day 12: 10k steps, legs session" maxlength="110" required>
          </div>
          <div>
            <label class="label" for="h-photo">Photo URL (optional)</label>
            <input id="h-photo" name="photo" class="input" type="url" placeholder="https://...">
          </div>
          <button type="submit" class="btn-primary">Post to Reel</button>
        </form>

        <div class="mt-8">
          <h3 class="text-sm font-semibold text-slate-700">Weekly Rewards Status</h3>
          <ul id="hub-rewards" class="mt-3 space-y-2 text-sm"></ul>
        </div>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="scripts/helpers.js"></script>
  <script src="scripts/ui.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
